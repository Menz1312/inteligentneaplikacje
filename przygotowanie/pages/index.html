<!DOCTYPE html>
<html>
    <head>
        <title>Index</title>
        <style>
            .test {
                float: left;
                background-color: lightgray;
                padding: 20px;
                margin: 5px;
            }
        </style>
    </head>
    <body>
        {{ range . }}
            <div class="test">
                <p><b>Nazwa: </b>{{ .Name }}</p>
                <p><b>H: </b>{{ .H }}</p>
                <p><b>W: </b>{{ .W }}</p>
                <p><b>L: </b>{{ .L }}</p>
            </div>
        {{ end }}
    </body>
</html>
